# Validates currency-dgs by listing supported currencies and converting a sample amount.
query Currency {
  supportedCurrencies
  convertCurrency(
    from: {
      currencyCode: "USD"
      units: 100
      nanos: 0
    }
    toCode: "EUR"
  ) {
    currencyCode
    units
    nanos
  }
}
