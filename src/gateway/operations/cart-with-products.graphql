# Teste la résolution du panier avec la fédération des produits (cart-dgs, CartItem.product, product-catalog-dgs, product-reviews-dgs) et la conversion des prix dans une monnaie
query CartWithProducts($userId: ID!, $currencyCode: String = "EUR") {
  cart(userId: $userId) {
    userId
    items {
      productId
      quantity
      product {
        id
        name
        picture
        priceUsd {
          currencyCode
          units
          nanos
        }
        price(currencyCode: $currencyCode) {
          currencyCode
          units
          nanos
        }
        averageReviewScore
      }
    }
  }
}
