# Validates cart resolution with federated product details, review data, and converted pricing.
query CartWithProducts($userId: ID!, $currencyCode: String = "EUR") {
  cart(userId: $userId) {
    userId
    items {
      productId
      quantity
      product {
        id
        name
        picture
        priceUsd {
          currencyCode
          units
          nanos
        }
        price(currencyCode: $currencyCode) {
          currencyCode
          units
          nanos
        }
        averageReviewScore
      }
    }
  }
}
