# Validates shipping cost calculation for a list of cart items and an optional shipping address.
query ShippingQuote($items: [CartItemInput!]!, $address: AddressInput) {
  shippingQuote(items: $items, address: $address) {
    costUsd {
      currencyCode
      units
      nanos
    }
  }
}
