# Adds an item to the cart to prepare cart and checkout gateway operation tests.
mutation AddItem($userId: ID!, $item: CartItemInput!) {
  addItem(userId: $userId, item: $item) {
    userId
    items {
      productId
      quantity
      product {
        id
        name
        priceUsd {
          currencyCode
          units
          nanos
        }
      }
    }
  }
}
