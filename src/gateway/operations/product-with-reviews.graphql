# Validates product listing with federated reviews, AI-generated review summaries, and converted pricing.
query ProductsWithReviews($question: String!, $currencyCode: String = "EUR") {
  products {
    id
    name
    description
    picture
    categories
    priceUsd {
      currencyCode
      units
      nanos
    }
    price(currencyCode: $currencyCode) {
      currencyCode
      units
      nanos
    }
    averageReviewScore
    aiReviewSummary(question: $question)
    reviews {
      username
      score
      description
    }
  }
}
