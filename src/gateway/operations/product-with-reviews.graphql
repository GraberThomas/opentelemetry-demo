# Teste l'intégration des reviews et commentaire IA directement dans la requête des produits, ainsi que le calcul du prix selon une monnaie.
query ProductsWithReviews($question: String!, $currencyCode: String = "EUR") {
  products {
    id
    name
    description
    picture
    categories
    priceUsd {
      currencyCode
      units
      nanos
    }
    price(currencyCode: $currencyCode) {
      currencyCode
      units
      nanos
    }
    averageReviewScore
    aiReviewSummary(question: $question)
    reviews {
      username
      score
      description
    }
  }
}
