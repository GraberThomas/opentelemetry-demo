# Teste l'intégration des reviews et commentaire IA directement en interrogeant la fiche d'un produit, ainsi que la conversion du prix dans une monnaie.
query ProductDetails($productId: ID!, $question: String!, $currencyCode: String = "EUR") {
  product(id: $productId) {
    id
    name
    description
    picture
    categories
    priceUsd {
      currencyCode
      units
      nanos
    }
    price(currencyCode: $currencyCode) {
      currencyCode
      units
      nanos
    }
    averageReviewScore
    aiReviewSummary(question: $question)
    reviews {
      username
      score
      description
    }
  }
}
