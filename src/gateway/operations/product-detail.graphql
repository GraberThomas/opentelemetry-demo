# Validates product detail resolution with reviews, AI-generated review summary, and converted product pricing.
query ProductDetails($productId: ID!, $question: String!, $currencyCode: String = "EUR") {
  product(id: $productId) {
    id
    name
    description
    picture
    categories
    priceUsd {
      currencyCode
      units
      nanos
    }
    price(currencyCode: $currencyCode) {
      currencyCode
      units
      nanos
    }
    averageReviewScore
    aiReviewSummary(question: $question)
    reviews {
      username
      score
      description
    }
  }
}
