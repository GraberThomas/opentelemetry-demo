# Validates that recommendation-dgs returns federated Product references with reviews and converted pricing.
query Recommendations($userId: ID!, $productIds: [ID!]!, $currencyCode: String = "EUR") {
  recommendations(userId: $userId, productIds: $productIds) {
    id
    name
    description
    picture
    categories
    priceUsd {
      currencyCode
      units
      nanos
    }
    price(currencyCode: $currencyCode) {
      currencyCode
      units
      nanos
    }
    averageReviewScore
  }
}
